apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  containers:
    - name: client
      image: python:3.12-slim-bookworm
      imagePullPolicy: Never
      command: ["python", "-c", "import time; time.sleep(86400)"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 64Mi
